# Solstice — Mac-first Iris shader pack (OpenGL 4.1 target, no compute/SSBO)
# Phase 1: minimal vanilla-faithful pipeline + profile/option wiring.

# Vanilla per-face light multiplier baked into the vertex colour, so the world
# reads like vanilla until custom directional lighting lands in Phase 2.
oldLighting=true

profile.POTATO=RENDER_SCALE=0.5
profile.REGULAR=RENDER_SCALE=0.75
profile.INSANE=RENDER_SCALE=1.0

screen=<profile> <empty> RENDER_SCALE FULLBRIGHT
sliders=RENDER_SCALE
