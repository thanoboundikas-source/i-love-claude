# Solstice - Mac-first Iris shader pack (OpenGL 4.1, no compute / SSBO / images).
# Every directive here is checked against the Iris docs and the Iris 26.1 source.
# Comment lines must start with "# " (hash + space): Iris runs a C preprocessor
# over this file, so "#word" lines can be read as directives.

# ---------------------------------------------------------------- features
iris.features.optional = BLOCK_EMISSION_ATTRIBUTE

# Our own directional lighting replaces vanilla's baked face shading.
oldLighting = false
# Vanilla AO goes to the vertex alpha so it only darkens sky/block light.
separateAo = true

# The sky, sun, moon, stars and clouds are all drawn by Solstice.
sky = false
sun = false
moon = false
stars = false
clouds = off
vignette = false
underwaterOverlay = false

# All particles after the deferred pass (forward shaded, like translucents).
particles.ordering = after

# ---------------------------------------------------------------- blending
# Packed G-buffer data must never be blended.
blend.gbuffers_terrain = off
blend.gbuffers_block = off
blend.gbuffers_entities = off
blend.gbuffers_hand = off
blend.gbuffers_lightning = off
blend.gbuffers_spidereyes.colortex1 = off
blend.gbuffers_water.colortex1 = off
blend.gbuffers_basic.colortex1 = off
blend.gbuffers_line.colortex1 = off

# ---------------------------------------------------------------- passes
# A pass whose feature is off is not compiled or run at all.
#ifndef SHADOWS
shadow.enabled = false
program.shadow.enabled = false
#endif
#if !defined CLOUDS || !defined CLOUDS_3D
program.deferred.enabled = false
#endif
#ifndef WATER_REFLECTIONS
program.composite.enabled = false
#endif
#if !defined WATER_REFLECTIONS && !defined WATER_REFRACTION
program.composite1.enabled = false
#endif

# ---------------------------------------------------------------- textures
# Vanilla cloud map (one texel = one 12x12 block cloud cell).
customTexture.cloudTex = minecraft:textures/environment/clouds.png

# ---------------------------------------------------------------- render scale
# Scaled passes render into smaller buffers; Iris sizes the pass viewport to
# its render target (CompositeRenderer), so no manual viewport tricks.
#if RENDER_SCALE == 50
size.buffer.colortex3 = 0.50 0.50
#elif RENDER_SCALE == 60
size.buffer.colortex3 = 0.60 0.60
#elif RENDER_SCALE == 70
size.buffer.colortex3 = 0.70 0.70
#elif RENDER_SCALE == 75
size.buffer.colortex3 = 0.75 0.75
#elif RENDER_SCALE == 80
size.buffer.colortex3 = 0.80 0.80
#elif RENDER_SCALE == 90
size.buffer.colortex3 = 0.90 0.90
#elif RENDER_SCALE == 100
size.buffer.colortex3 = 1.00 1.00
#endif
# Reflections and godrays: RENDER_SCALE, halved again with HALF_RES_FX.
#ifdef HALF_RES_FX
#if RENDER_SCALE == 50
size.buffer.colortex4 = 0.250 0.250
#elif RENDER_SCALE == 60
size.buffer.colortex4 = 0.300 0.300
#elif RENDER_SCALE == 70
size.buffer.colortex4 = 0.350 0.350
#elif RENDER_SCALE == 75
size.buffer.colortex4 = 0.375 0.375
#elif RENDER_SCALE == 80
size.buffer.colortex4 = 0.400 0.400
#elif RENDER_SCALE == 90
size.buffer.colortex4 = 0.450 0.450
#elif RENDER_SCALE == 100
size.buffer.colortex4 = 0.500 0.500
#endif
#else
#if RENDER_SCALE == 50
size.buffer.colortex4 = 0.500 0.500
#elif RENDER_SCALE == 60
size.buffer.colortex4 = 0.600 0.600
#elif RENDER_SCALE == 70
size.buffer.colortex4 = 0.700 0.700
#elif RENDER_SCALE == 75
size.buffer.colortex4 = 0.750 0.750
#elif RENDER_SCALE == 80
size.buffer.colortex4 = 0.800 0.800
#elif RENDER_SCALE == 90
size.buffer.colortex4 = 0.900 0.900
#elif RENDER_SCALE == 100
size.buffer.colortex4 = 1.000 1.000
#endif
#endif

# ---------------------------------------------------------------- profiles
profile.POTATO = RENDER_SCALE=50 HALF_RES_FX STARS CLOUDS !CLOUDS_3D !CLOUD_SHADOWS CLOUD_STEPS=16 \
    !SHADOWS shadowMapResolution=1024 shadowDistance=96.0 SHADOW_SAMPLES=4 !COLORED_SHADOWS !COLORED_LIGHT FOLIAGE_SSS \
    WATER_WAVES !WATER_REFLECTIONS !WATER_REFRACTION SSR_STEPS=8 UNDERWATER_FOG \
    FOG !GODRAYS GODRAY_SAMPLES=6 !WET_LOOK !BLOOM !TAA !SHARPEN !GENERATED_NORMALS !GENERATED_SPECULAR

profile.REGULAR = RENDER_SCALE=75 HALF_RES_FX STARS CLOUDS CLOUDS_3D CLOUD_SHADOWS CLOUD_STEPS=24 \
    SHADOWS shadowMapResolution=2048 shadowDistance=128.0 SHADOW_SAMPLES=8 COLORED_SHADOWS COLORED_LIGHT FOLIAGE_SSS \
    WATER_WAVES WATER_REFLECTIONS WATER_REFRACTION SSR_STEPS=16 UNDERWATER_FOG \
    FOG GODRAYS GODRAY_SAMPLES=8 WET_LOOK BLOOM TAA SHARPEN GENERATED_NORMALS GENERATED_SPECULAR

profile.INSANE = RENDER_SCALE=100 !HALF_RES_FX STARS CLOUDS CLOUDS_3D CLOUD_SHADOWS CLOUD_STEPS=32 \
    SHADOWS shadowMapResolution=4096 shadowDistance=192.0 SHADOW_SAMPLES=16 COLORED_SHADOWS COLORED_LIGHT FOLIAGE_SSS \
    WATER_WAVES WATER_REFLECTIONS WATER_REFRACTION SSR_STEPS=32 UNDERWATER_FOG \
    FOG GODRAYS GODRAY_SAMPLES=12 WET_LOOK BLOOM TAA SHARPEN GENERATED_NORMALS GENERATED_SPECULAR

# ---------------------------------------------------------------- menu
screen = <profile> FULLBRIGHT RENDER_SCALE HALF_RES_FX [SKY] [LIGHTING] [WATER] [ATMOSPHERE] [POST] [PBR] EXPOSURE SATURATION
screen.columns = 2
screen.SKY = STARS <empty> CLOUDS CLOUDS_3D CLOUD_SHADOWS CLOUD_THICKNESS CLOUD_STEPS
screen.LIGHTING = SHADOWS shadowMapResolution shadowDistance SHADOW_SAMPLES SHADOW_SOFTNESS COLORED_SHADOWS COLORED_LIGHT FOLIAGE_SSS sunPathRotation
screen.WATER = WATER_WAVES WATER_REFLECTIONS WATER_REFRACTION SSR_STEPS UNDERWATER_FOG
screen.ATMOSPHERE = FOG FOG_DENSITY GODRAYS GODRAY_STRENGTH GODRAY_SAMPLES WET_LOOK
screen.POST = BLOOM BLOOM_STRENGTH TAA <empty> SHARPEN SHARPEN_AMOUNT
screen.PBR = GENERATED_NORMALS NORMAL_STRENGTH GENERATED_SPECULAR

sliders = RENDER_SCALE EXPOSURE SATURATION CLOUD_THICKNESS CLOUD_STEPS shadowMapResolution shadowDistance \
    SHADOW_SAMPLES SHADOW_SOFTNESS sunPathRotation SSR_STEPS FOG_DENSITY GODRAY_STRENGTH GODRAY_SAMPLES \
    BLOOM_STRENGTH SHARPEN_AMOUNT NORMAL_STRENGTH
