# Solstice block IDs (read in shaders through mc_Entity.x).
# Syntax verified against the Iris docs (Miscellaneous > block.properties).
# Unknown names are ignored by Iris, so newer/older block names are harmless.
#
#  1  water
# 10  leaves                (light passes through, subsurface)
# 11  small plants / crops  (light passes through, subsurface)
# 20  metal blocks          (generated specular: metallic)
# 30  whole texture glows   (emissive blocks with no dark parts)
# Everything else that emits light (torches, lanterns, ores...) is detected
# automatically from at_midBlock.w and its bright texels.

